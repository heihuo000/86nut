[project]
name = "dnf-rag"
version = "1.0.0"
description = "DNF Knowledge Base RAG System"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.1",
    "openai>=1.0.0",
    "dashscope>=1.0.0",
    "python-dotenv>=0.19.0",
    "mcp>=0.1.0",
    "jieba>=0.42.1",
    "tqdm>=4.62.0",
    "requests>=2.25.0"
]

[tool.uv]
dev-dependencies = [
    "pytest>=6.0.0",
    "black>=21.0.0",
    "flake8>=3.9.0"
]